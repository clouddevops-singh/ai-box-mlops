apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-box-api
  namespace: ai-box
  labels:
    app: ai-box-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-box-api
  template:
    metadata:
      labels:
        app: ai-box-api
    spec:
      serviceAccountName: ai-box-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ai-box-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-box-api
  namespace: ai-box
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-box-api
